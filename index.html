<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Comfort Theme Pack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" src="/preview/src/main.js"></script>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="eyebrow">VS Code Theme Pack</p>
        <h1>Anime Comfort</h1>
        <p class="subtitle">Five anime-inspired dark variants tuned for low glare, reduced fatigue, and sustained focus.</p>
      </section>

      <section class="controls">
        <label for="theme-select">Variant</label>
        <select id="theme-select" aria-label="Theme variant selector"></select>
      </section>

      <section class="preview-grid">
        <article class="card code-card">
          <div class="card-title">Editor Preview</div>
          <pre><code id="code-sample"></code></pre>
        </article>

        <article class="card palette-card">
          <div class="card-title">Palette</div>
          <div id="swatches" class="swatches"></div>
        </article>
      </section>
    </main>
  </body>
</html>
